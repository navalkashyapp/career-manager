version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career-manager-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Persistent SQLite and application state
      - ./data:/app/data
      - ./reports:/app/reports
      - ./career-ops/data:/app/career-ops/data
      # Mount Firebase service account credentials (if present)
      - ./service-account.json:/app/service-account.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Ngrok public tunnel: routes HTTPS traffic to the backend container
  ngrok:
    image: ngrok/ngrok:latest
    container_name: career-manager-ngrok
    restart: unless-stopped
    command:
      - "http"
      - "backend:3000"
      - "--url=${NGROK_DOMAIN:-uncolored-enzyme-unsightly.ngrok-free.dev}"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    depends_on:
      backend:
        condition: service_healthy

  # Optional Cloudflare Tunnel alternative (start with: docker compose --profile cloudflare up -d)
  cloudflare:
    image: cloudflare/cloudflared:latest
    container_name: career-manager-cloudflare
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - cloudflare
